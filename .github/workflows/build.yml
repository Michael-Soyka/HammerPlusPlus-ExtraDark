name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# The release job creates a tag and a release
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The x64 configuration builds the x86 proxy DLL too and packs both into the installer
      - name: Build
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item bin/hppxdark_setup.exe, README.md, README_ru.md, LICENSE dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HammerPlusPlus-ExtraDark
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Timestamp
        id: stamp
        run: echo "value=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One zip per build variant: <artifact name>-<timestamp>.zip
      - name: Pack
        run: |
          mkdir release
          for dir in artifacts/*/; do
            name="$( basename "$dir" )"
            ( cd "$dir" && zip -r -q "../../release/${name}-${{ steps.stamp.outputs.value }}.zip" . )
          done
          ls -l release

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: HammerPlusPlus-ExtraDark-${{ steps.stamp.outputs.value }}
          name: HammerPlusPlus-ExtraDark-${{ steps.stamp.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: release/*.zip
          fail_on_unmatched_files: true
